{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}待辦清單{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'todo:list' %}">我的待辦清單</a>
      {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">
          <span class="text-white-50 small">{{ user.username }}</span>
          <a class="btn btn-sm btn-outline-light" href="{% url 'todo:api_token' %}">API token</a>
          <form method="post" action="{% url 'logout' %}" class="mb-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-light">登出</button>
          </form>
        </div>
      {% else %}
        <div class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">登入</a>
          <a class="btn btn-sm btn-light" href="{% url 'todo:signup' %}">註冊</a>
        </div>
      {% endif %}
      <a class="nav-link text-white-50" href="/admin/">後台</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
