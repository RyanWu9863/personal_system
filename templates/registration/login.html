{% extends "base.html" %}
{% block title %}登入{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">登入</h5>
        <form method="post">
          {% csrf_token %}
          {% include "_form.html" %}
          <button type="submit" class="btn btn-primary w-100">登入</button>
        </form>
        <p class="mt-3 mb-1 small">
          <a href="{% url 'password_reset' %}">忘記密碼？</a>
        </p>
        <p class="mb-0 small">還沒有帳號？<a href="{% url 'todo:signup' %}">註冊一個</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
