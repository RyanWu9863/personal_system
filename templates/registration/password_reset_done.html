{% extends "base.html" %}
{% block title %}信已寄出{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-2">信已寄出</h5>
        <p class="text-muted small mb-2">
          如果這個信箱有對應的帳號，重設連結已經寄出了，請去收信。
        </p>
        <p class="text-muted small mb-0">
          沒收到的話，看一下垃圾郵件匣，或確認信箱有沒有打錯。
        </p>
        <p class="mt-3 mb-0 small"><a href="{% url 'login' %}">← 回登入</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
