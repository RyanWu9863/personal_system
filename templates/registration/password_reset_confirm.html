{% extends "base.html" %}
{% block title %}設定新密碼{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        {% if validlink %}
          <h5 class="card-title mb-3">設定新密碼</h5>
          <form method="post">
            {% csrf_token %}
            {% include "_form.html" %}
            <button type="submit" class="btn btn-primary w-100">更新密碼</button>
          </form>
        {% else %}
          <h5 class="card-title mb-2">連結已失效</h5>
          <div class="alert alert-danger py-2 small mb-3" role="alert">
            這個重設連結無效或已經用過了。
          </div>
          <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">重新申請一次</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
