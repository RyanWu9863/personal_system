{% extends "base.html" %}
{% block title %}重設密碼{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-2">重設密碼</h5>
        <p class="text-muted small">
          輸入註冊時填的電子郵件，我們會寄一封重設連結給你。
        </p>
        <form method="post">
          {% csrf_token %}
          {% include "_form.html" %}
          <button type="submit" class="btn btn-primary w-100">寄出重設連結</button>
        </form>
        <p class="mt-3 mb-0 small"><a href="{% url 'login' %}">← 回登入</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
