{% extends "base.html" %}
{% block title %}註冊{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">註冊</h5>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">登入</button>
        </form>
        <p class="mt-3 mb-0 small">還沒有帳號？<a href="{% url 'login' %}">註冊一個</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
